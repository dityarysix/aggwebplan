# Collects the news every hour and publishes the website on GitHub Pages.
name: Publish Jawa Timur Sepekan

on:
  schedule:
    - cron: '17 * * * *'   # every hour, at minute 17
    - cron: '3 1 * * *'    # 08:03 WIB: backup for the daily wrap-up (cron-job.org starts it at 07:56)
    - cron: '3 10 * * 5'   # Friday 17:03 WIB: backup for the weekly wrap-up (cron-job.org at 16:56)
  push:
    branches: [main]
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The weekly archive is kept between runs in the Actions cache.
      - name: Restore this week's archive
        uses: actions/cache/restore@v4
        with:
          path: data
          key: archive-${{ github.run_id }}
          restore-keys: archive-

      - run: npm run build
        env:
          # Optional: lets the build write articles from official releases (see README).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save this week's archive
        uses: actions/cache/save@v4
        with:
          path: data
          key: archive-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
